<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Numbers 9–17 | KG3 Game</title><style>
:root{font-family:Arial,'Trebuchet MS',sans-serif;color:#24324e;background:#edf8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(140deg,#e5f8ff,#fff1de)}main{max-width:1050px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:clamp(20px,3vw,32px);font-weight:900;color:#3566a6}.mini{background:#fff;padding:10px 16px;border-radius:20px;font-weight:800;box-shadow:0 3px 9px #b6c5d644}button{cursor:pointer;font:inherit;touch-action:manipulation}.switch{border:0;background:#fff;border-radius:25px;padding:12px 18px;font-weight:800}.panel{background:white;border-radius:35px;padding:clamp(14px,3vw,30px);margin-top:15px;box-shadow:0 8px 24px #7f9fc52c;text-align:center;min-height:75vh}.progress{height:14px;border-radius:20px;background:#e7ecf4;overflow:hidden;margin-bottom:12px}.fill{height:100%;width:0;background:linear-gradient(90deg,#5ccac5,#6e8dec);transition:width .25s}.type{font-size:clamp(22px,3.7vw,38px);font-weight:900;margin:16px 0}.sub{font-size:clamp(15px,2.5vw,23px);color:#61748d;margin:4px 0 15px}.items{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(5px,1vw,12px);justify-items:center;align-items:center;max-width:690px;margin:12px auto;min-height:176px;padding:15px;border-radius:22px;background:#f4faff}.object{font-size:clamp(32px,5vw,51px);line-height:1.25}.numberShow{font-size:clamp(96px,18vw,190px);font-weight:900;color:#397ac7;line-height:1.4}.sequence{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:48px auto}.tile{background:#dff0ff;border:4px solid #8abbeb;border-radius:20px;min-width:clamp(75px,12vw,130px);padding:18px 10px;font-size:clamp(35px,6vw,64px);font-weight:900}.missing{background:#fff0be;border-color:#e5b24d}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,20px);margin:25px auto;max-width:850px}.ans{border:4px solid #cadaf4;background:#f3f8ff;border-radius:22px;min-height:clamp(90px,15vh,145px);font-size:clamp(40px,8vw,90px);font-weight:900;color:#304e8c;transition:transform .12s}.ans:active{transform:scale(.96)}.ans.right{background:#d0f9e2;border-color:#23ad6e}.ans.wrong{background:#ffe0df;border-color:#e66666}.feedback{font-size:clamp(23px,4vw,38px);font-weight:900;min-height:44px;margin:10px}.next{border:0;border-radius:22px;padding:18px 45px;background:#ffb949;font-size:25px;font-weight:900;color:#573a10}.next:disabled{opacity:.4;cursor:default}.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:63vh}.splash h1{font-size:clamp(42px,8vw,92px);color:#396ec6;margin:10px}.splash p{font-size:clamp(20px,3vw,28px)}.primary{border:0;background:#4b80e0;color:white;padding:24px 64px;border-radius:27px;font-size:clamp(24px,4vw,35px);font-weight:900;margin:25px}.namefield{font-size:clamp(22px,3vw,30px);padding:15px 20px;border:3px solid #8abbeb;border-radius:18px;width:min(90%,420px);text-align:center}.namebadge{font-size:clamp(18px,2.7vw,26px);font-weight:900;color:#3566a6;margin:10px}.stars{font-size:55px}.note{color:#64748b;font-size:15px}@media(max-width:530px){.items{grid-template-columns:repeat(5,1fr);min-height:170px}.answers{gap:7px}.ans{border-width:3px}.panel{border-radius:20px}.top{gap:6px}}
</style></head><body><main><header class="top"><div class="brand">🌈 KG3 Math Adventure</div><div id="counter" class="mini">20 Questions</div><button id="sound" class="switch" aria-label="Toggle sounds">🔊 Sound ON</button></header><section class="panel"><div class="progress"><div id="bar" class="fill"></div></div><div id="game"></div></section></main><script>
'use strict';const TOTAL=20,icons=['⭐','🍎','🦋','🌼','🐠','🎈','🍓','❤️','🚗','🐞','🍪','🌟'];const $=id=>document.getElementById(id);let questions=[],idx=0,score=0,answered=false,sound=true,ctx=null,studentName='';
function tone(correct){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const now=ctx.currentTime;const notes=correct?[523,659,784]:[240,185];notes.forEach((hz,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(hz,now+i*.13);gain.gain.setValueAtTime(.0001,now+i*.13);gain.gain.exponentialRampToValueAtTime(.13,now+i*.13+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+i*.13+.17);osc.connect(gain).connect(ctx.destination);osc.start(now+i*.13);osc.stop(now+i*.13+.18)})}catch(e){}}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function choices(n){let a=[n];const pool=shuffle(Array.from({length:9},(_,i)=>i+9).filter(x=>x!==n));a.push(...pool.slice(0,2));return shuffle(a)}
function build(){let all=[];for(let n=9;n<=17;n++)all.push({kind:'count',n,icon:icons[n%icons.length]});for(const n of [9,11,13,15,17])all.push({kind:'read',n});for(const n of [10,13,16])all.push({kind:'before',n});for(const n of [11,14,17])all.push({kind:'after',n});return shuffle(all)}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;')}
function intro(){ $('game').innerHTML='<div class="splash"><div class="stars">⭐ 🎈 🌈</div><h1>Numbers 9–17</h1><p>20 fun questions: Count • Read • Before • After</p><label for="student" class="namebadge">Student Name</label><input id="student" class="namefield" placeholder="Enter your name" maxlength="40" autocomplete="off"><button class="primary" id="start">▶ Start Game</button><div class="note">Tap the correct number. Suitable for a classroom smart board.</div></div>';$('start').onclick=start}
function start(){studentName=($('student')?.value||studentName).trim()||'Student';questions=build();idx=0;score=0;show()}
function show(){answered=false;if(idx>=questions.length)return finish();const q=questions[idx];$('counter').textContent=`${studentName} ⭐ ${score} / ${TOTAL} • Question ${idx+1}`;$('bar').style.width=`${idx/TOTAL*100}%`;let prompt='',view='',correct=q.n;
if(q.kind==='count'){prompt='How many?';view='<div class="items" role="img" aria-label="Count the objects">'+Array.from({length:q.n},()=>`<span class="object">${q.icon}</span>`).join('')+'</div>'}
if(q.kind==='read'){prompt='Find the number';view=`<div class="numberShow">${q.n}</div>`}
if(q.kind==='before'){prompt='What number comes before?';correct=q.n;view=`<div class="sequence"><div class="tile missing">?</div><div class="tile">${q.n+1}</div><div class="tile">${q.n+2}</div></div>`}
if(q.kind==='after'){prompt='What number comes next?';correct=q.n;view=`<div class="sequence"><div class="tile">${q.n-2}</div><div class="tile">${q.n-1}</div><div class="tile missing">?</div></div>`}
$('game').innerHTML=`<div class="type">${prompt}</div><div class="sub">Choose the correct answer</div>${view}<div class="answers">${choices(correct).map(v=>`<button class="ans" data-value="${v}">${v}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><button id="next" class="next" disabled>Next ➜</button>`;document.querySelectorAll('.ans').forEach(b=>b.onclick=()=>answer(b,correct));$('next').onclick=()=>{idx++;show()}}
function answer(btn,correct){if(answered)return;const val=+btn.dataset.value;if(val!==correct){btn.classList.add('wrong');$('feedback').textContent='Try again! 💛';tone(false);setTimeout(()=>{if(!answered)btn.classList.remove('wrong')},650);return}answered=true;score++;btn.classList.add('right');document.querySelectorAll('.ans').forEach(b=>b.disabled=true);$('feedback').textContent='Great job! ⭐';tone(true);$('next').disabled=false;if(idx===TOTAL-1)$('next').textContent='See results 🎉'}
function finish(){$('bar').style.width='100%';$('counter').textContent=`${studentName} ⭐ ${score} / ${TOTAL}`;$('game').innerHTML=`<div class="splash"><div class="stars">🎉 🌟 🏆</div><h1>Well Done!</h1><p class="namebadge">${esc(studentName)} ⭐ ${score} / ${TOTAL}</p><p>You completed all 20 questions!</p><button class="primary" id="again">Play Again ↻</button></div>`;$('again').onclick=start;tone(true)}
$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Sound ON':'🔇 Sound OFF'};intro();
</script></body></html>
